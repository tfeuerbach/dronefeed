# MediaMTX — RTMP/RTSP/SRT. Auth delegated to Phoenix via MTX_AUTHHTTPADDRESS.

logLevel: info
logDestinations: [stdout]

# Slow/remote 4K readers + loop seek gaps must not trip these.
readTimeout: 60s
writeTimeout: 60s

# High-bitrate MPEG-TS ingest (4K ~100Mbps) needs a large UDP read buffer.
# Host net.core.rmem_max must be >= this (see deploy/README).
udpReadBufferSize: 16777216

api: true
apiAddress: :9997

rtsp: true
rtspAddress: :8554
rtmp: true
rtmpAddress: :1935
hls: true
hlsAddress: :8888
# Browser live preview — keep playlist short and remux immediately so
# readers are not stuck ~N×GOP behind the publisher (DJI GOPs are often 2–4s+).
hlsAlwaysRemux: true
hlsVariant: lowLatency
# LL-HLS requires ≥7; latency is controlled by the player staying on the live edge.
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsMuxerCloseAfter: 30s
webrtc: false
srt: true
srtAddress: :8890

# Power-of-two outgoing packet queue. Default 512 ≈ 5Mbps; 4K FMV (~100Mbps)
# with multiple SRT readers needs far more or readers get starved and see EOF.
writeQueueSize: 65536

authMethod: http
# Overridden in Compose by MTX_AUTHHTTPADDRESS=http://web:4000/api/mediamtx/auth
authHTTPAddress: http://web:4000/api/mediamtx/auth
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

pathDefaults:
  source: publisher
  # Unlimited concurrent SRT/RTSP/RTMP readers.
  maxReaders: 0
  # Keep relative PTS from the publisher (FFmpeg genpts keeps loops monotonic).
  useAbsoluteTimestamp: false

paths:
  "~^vod/.+$":
  "~^live/.+$":
