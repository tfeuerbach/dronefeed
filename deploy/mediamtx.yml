# MediaMTX — RTMP/RTSP. Auth delegated to Phoenix via MTX_AUTHHTTPADDRESS.

logLevel: info
logDestinations: [stdout]

api: yes
apiAddress: :9997

rtsp: yes
rtspAddress: :8554
rtmp: yes
rtmpAddress: :1935
hls: yes
hlsAddress: :8888
webrtc: no
srt: no

authMethod: http
authHTTPAddress: http://127.0.0.1:4000/api/mediamtx/auth
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

pathDefaults:
  source: publisher

paths:
  "~^vod/.+$":
  "~^live/.+$":
