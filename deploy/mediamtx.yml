# MediaMTX — RTMP/RTSP/SRT. Auth delegated to Phoenix via MTX_AUTHHTTPADDRESS.

logLevel: info
logDestinations: [stdout]

api: yes
apiAddress: :9997

rtsp: yes
rtspAddress: :8554
rtmp: yes
rtmpAddress: :1935
hls: yes
hlsAddress: :8888
webrtc: no
srt: yes
srtAddress: :8890

# 4K FMV needs a larger write queue; default drops frames under slow readers.
writeQueueSize: 1024

authMethod: http
# Overridden in Compose by MTX_AUTHHTTPADDRESS=http://web:4000/api/mediamtx/auth
authHTTPAddress: http://web:4000/api/mediamtx/auth
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

pathDefaults:
  source: publisher

paths:
  "~^vod/.+$":
  "~^live/.+$":
