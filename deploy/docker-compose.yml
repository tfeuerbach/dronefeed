services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-drone_feed_prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      PHX_SERVER: "true"
      PORT: "4000"
      DATABASE_URL: ecto://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB:-drone_feed_prod}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE}
      PHX_HOST: ${PHX_HOST:?set PHX_HOST}
      PHX_SCHEME: ${PHX_SCHEME:-https}
      PHX_URL_PORT: ${PHX_URL_PORT:-}
      MEDIA_HOST: ${MEDIA_HOST:-}
      MEDIA_IP: ${MEDIA_IP:-}
      RTMP_PORT: ${RTMP_PORT:-1935}
      RTSP_PORT: ${RTSP_PORT:-8554}
      SRT_PORT: ${SRT_PORT:-8890}
      SRT_PULL_LATENCY_MS: ${SRT_PULL_LATENCY_MS:-2000}
      # Distribution encode for Public feed (override in .env). Height: 720, 1080, or 0/source.
      PUBLISH_VIDEO_HEIGHT: ${PUBLISH_VIDEO_HEIGHT:-720}
      PUBLISH_VIDEO_BITRATE: ${PUBLISH_VIDEO_BITRATE:-2.5M}
      PUBLISH_VIDEO_MAXRATE: ${PUBLISH_VIDEO_MAXRATE:-2.5M}
      PUBLISH_VIDEO_BUFSIZE: ${PUBLISH_VIDEO_BUFSIZE:-5M}
      PUBLISH_GOP: ${PUBLISH_GOP:-30}
      PUBLISH_X264_PRESET: ${PUBLISH_X264_PRESET:-veryfast}
      PUBLISH_X264_PROFILE: ${PUBLISH_X264_PROFILE:-main}
      MEDIAMTX_RTMP_URL: rtmp://mediamtx:1935
      MEDIAMTX_RTSP_URL: rtsp://mediamtx:8554
      MEDIAMTX_API_URL: http://mediamtx:9997
      UDP_INGEST_PORT_MIN: ${UDP_INGEST_PORT_MIN:-8900}
      UDP_INGEST_PORT_MAX: ${UDP_INGEST_PORT_MAX:-8999}
      STORAGE_ROOT: /var/lib/drone-feed/storage
      RETENTION_DAYS: ${RETENTION_DAYS:-5}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_CONTACT: ${ADMIN_CONTACT:-admin@example.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@example.com}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-DroneFeed}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      EMBED_COOKIES: ${EMBED_COOKIES:-false}
      SESSION_SAME_SITE: ${SESSION_SAME_SITE:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      FRAME_ANCESTORS: ${FRAME_ANCESTORS:-}
      MUX_SCRIPT: /app/scripts/mux_to_stanag.py
      EXTRACT_KLV_SCRIPT: /app/scripts/extract_klv_track.py
      PYTHON_PATH: python3
    volumes:
      - flight_storage:/var/lib/drone-feed/storage
    expose:
      - "4000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2.9-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PHX_HOST: ${PHX_HOST:?set PHX_HOST}
      # Only used by the default Caddyfile (Let's Encrypt). Ignored for self-signed.
      ACME_EMAIL: ${ACME_EMAIL:-unused@example.com}
    volumes:
      # IP-first HTTP: CADDYFILE=Caddyfile.http  (or Caddyfile.selfsigned for TLS)
      - ./${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

  mediamtx:
    # 1.14+ for udp+mpegts; 1.19+ includes SRT high-latency handshake fixes
    image: bluenviron/mediamtx:1.19.3
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    environment:
      MTX_AUTHHTTPADDRESS: http://web:4000/api/mediamtx/auth
    ports:
      - "${RTMP_PORT:-1935}:1935"
      - "${RTSP_PORT:-8554}:8554"
      - "${SRT_PORT:-8890}:8890/udp"
      - "${HLS_PORT:-8888}:8888"
      # MPEG-TS UDP ingest (one port per live session)
      - "${UDP_INGEST_PORT_MIN:-8900}-${UDP_INGEST_PORT_MAX:-8999}:${UDP_INGEST_PORT_MIN:-8900}-${UDP_INGEST_PORT_MAX:-8999}/udp"
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  flight_storage:
  caddy_data:
  caddy_config:
